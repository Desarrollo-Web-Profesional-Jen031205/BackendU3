services:
  backend:
    build: .
    container_name: baguette_backend
    ports:
      - "3001:3001"
    environment:
      - DATABASE_URL=${DATABASE_URL} # <- Aquí Docker toma la variable de tu .env
      - PORT=${PORT}
      - JWT_SECRET=${JWT_SECRET}
    networks:
      - app-network

  nginx:
    image: nginx:latest
    container_name: baguette_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./nginx/certs:/etc/nginx/certs
    depends_on:
      - backend
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
